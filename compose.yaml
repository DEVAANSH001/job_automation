services:
  jobbot:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      API_TOKEN: ${API_TOKEN:?Set API_TOKEN in .env}
      CONFIG_PATH: /app/config.json
    volumes:
      - ./config.json:/app/config.json:ro
      - jobbot-data:/app/data
    shm_size: 1gb
    init: true
volumes:
  jobbot-data:
